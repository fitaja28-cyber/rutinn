wal Laravel: routing, Blade view, data dinamis, controller, dan model + migration.\n\n## Prasyarat\nPHP 8.2+, Composer, MySQL (XAMPP/Laragon), Node.js (opsional).\n\n## Langkah instalasi\n1. Cek alat:            php -v && composer -V\n2. Buat project:        composer create-project laravel/laravel tugasweb-p9\n3. Masuk folder:        cd tugasweb-p9\n4. Buat database `tugasweb_p9` di phpMyAdmin (collation utf8mb4_unicode_ci).\n5. Salin isi bagian DB_* dari file .env pada repo ini ke .env project.\n6. Buat controller:     php artisan make:controller ProdukController\n7. Buat model+migrasi:  php artisan make:model Produk -m\n8. Isi file sesuai tab \"Kode proyek\", lalu:  php artisan migrate\n9. Jalankan server:     php artisan serve   -> http://127.0.0.1:8000\n10. Ambil screenshot welcome page dan tiap halaman.\n\n## Route\n| URL            | Keterangan                                   |\n|----------------|-----------------------------------------------|\n| /              | Beranda, array $fitur dari route              |\n| /about         | Profil, array asosiatif $profil               |\n| /contact       | Kontak, array 2 dimensi $kontak               |\n| /hello/{nama}  | Bonus: route parameter                        |\n| /produk        | ProdukController@index, data dari tabel produks |\n\nCek semua route: php artisan route:list\n\n## Struktur folder (yang dipakai tugas ini)\napp/Http/Controllers   Controller: menerima request, mengembalikan view.\napp/Models             Model Eloquent: representasi tabel database.\ndatabase/migrations    Skema tabel (versi-kan struktur database).\nresources/views        Template Blade (tampilan).\nroutes/web.php         Daftar URL web dan penanganannya.\npublic/                Satu-satunya folder yang diakses browser (index.php).\n.env                   Konfigurasi lingkungan: database, APP_URL, dll.\nvendor/                Library hasil Composer (jangan di-commit).\nartisan                CLI Laravel (make:*, migrate, serve, tinker).\n\n## Alur request\nBrowser -> public/index.php -> routes/web.php -> (Controller) -> (Model) -> View Blade -> HTML ke browser.\n\n## Menambah data contoh\nphp artisan tinker\n>>> App\\Models\\Produk::create(['nama' => 'Keyboard Mekanik', 'harga' => 450000]);\n\n## Bonus\n- Tailwind CDN di layouts/app.blade.php\n- Route parameter /hello/{nama}\n"}], "readme": "# TugasWeb-P9-LaravelSetup\n\nSetup awal Laravel: routing, Blade view, data dinamis, controller, dan model + migration.\n\n## Prasyarat\nPHP 8.2+, Composer, MySQL (XAMPP/Laragon), Node.js (opsional).\n\n## Langkah instalasi\n1. Cek alat:            php -v && composer -V\n2. Buat project:        composer create-project laravel/laravel tugasweb-p9\n3. Masuk folder:        cd tugasweb-p9\n4. Buat database `tugasweb_p9` di phpMyAdmin (collation utf8mb4_unicode_ci).\n5. Salin isi bagian DB_* dari file .env pada repo ini ke .env project.\n6. Buat controller:     php artisan make:controller ProdukController\n7. Buat model+migrasi:  php artisan make:model Produk -m\n8. Isi file sesuai tab \"Kode proyek\", lalu:  php artisan migrate\n9. Jalankan server:     php artisan serve   -> http://127.0.0.1:8000\n10. Ambil screenshot welcome page dan tiap halaman.\n\n## Route\n| URL            | Keterangan                                   |\n|----------------|-----------------------------------------------|\n| /              | Beranda, array $fitur dari route              |\n| /about         | Profil, array asosiatif $profil               |\n| /contact       | Kontak, array 2 dimensi $kontak               |\n| /hello/{nama}  | Bonus: route parameter                        |\n| /produk        | ProdukController@index, data dari tabel produks |\n\nCek semua route: php artisan route:list\n\n## Struktur folder (yang dipakai tugas ini)\napp/Http/Controllers   Controller: menerima request, mengembalikan view.\napp/Models             Model Eloquent: representasi tabel database.\ndatabase/migrations    Skema tabel (versi-kan struktur database).\nresources/views        Template Blade (tampilan).\nroutes/web.php         Daftar URL web dan penanganannya.\npublic/                Satu-satunya folder yang diakses browser (index.php).\n.env                   Konfigurasi lingkungan: database, APP_URL, dll.\nvendor/                Library hasil Composer (jangan di-commit).\nartisan                CLI Laravel (make:*, migrate, serve, tinker).\n\n## Alur request\nBrowser -> public/index.php -> routes/web.php -> (Controller) -> (Model) -> View Blade -> HTML ke browser.\n\n## Menambah data contoh\nphp artisan tinker\n>>> App\\Models\\Produk::create(['nama' => 'Keyboard Mekanik', 'harga' => 450000]);\n\n## Bonus\n- Tailwind CDN di layouts/app.blade.php\n- Route parameter /hello/{nama}\n", "demoHtml": "\n<div class=\"two\">\n <div>\n  <div class=\"browser\">\n   <div class=\"bar\"><span>127.0.0.1:8000<\/span><input id=\"u\" value=\"/\" aria-label=\"Path URL\"><button class=\"btn sm\" id=\"go\">Buka<\/button><\/div>\n   <div class=\"pg\" id=\"pg\"><\/div>\n  <\/div>\n  <div class=\"seg\" style=\"margin-top:12px\" id=\"q\"><\/div>\n <\/div>\n <div>\n  <h2 style=\"margin-top:0\">php artisan route:list<\/h2>\n  <table class=\"t\"><thead><tr><th>URI<\/th><th>Nama<\/th><th>Aksi<\/th><\/tr><\/thead><tbody>\n   <tr><td><code>/<\/code><\/td><td>home<\/td><td>Closure<\/td><\/tr>\n   <tr><td><code>about<\/code><\/td><td>about<\/td><td>Closure<\/td><\/tr>\n   <tr><td><code>contact<\/code><\/td><td>contact<\/td><td>Closure<\/td><\/tr>\n   <tr><td><code>hello/{nama}<\/code><\/td><td>hello<\/td><td>Closure<\/td><\/tr>\n   <tr><td><code>produk<\/code><\/td><td>produk<\/td><td>ProdukController@index<\/td><\/tr>\n  <\/tbody><\/table>\n  <p class=\"lead\" style=\"margin-top:10px;font-size:.9rem\">Simulasi di browser: tampilannya meniru hasil view Blade. Ketik URL seperti <code>/hello/budi<\/code> atau alamat yang tidak ada untuk melihat 404.<\/p>\n <\/div>\n<\/div>\n", "demoJs": "\nvar pg=document.getElementById('pg'),u=document.getElementById('u'),q=document.getElementById('q');\nvar nav='<div class=\"tn\"><b>Beranda<\/b><span>Tentang<\/span><span>Kontak<\/span><span>Produk<\/span><\/div>';\nvar R={\n'/':function(){return '<h3>Selamat Datang di Laravel<\/h3><p class=\"m\">Fitur yang dipelajari minggu ini:<\/p><ul>'+['Routing ekspresif','Blade templating','Eloquent ORM','Artisan CLI'].map(function(x){return '<li>'+x+'<\/li>'}).join('')+'<\/ul>'},\n'/about':function(){var p={Nama:'Fitry Meriyana Halawa',NIM:'4253550010','Program Studi':'Ilmu Komputer',Kampus:'Universitas Negeri Medan','Mata Kuliah':'Pemrograman Web'};return '<h3>Tentang Saya<\/h3><dl>'+Object.keys(p).map(function(k){return '<dt>'+k+'<\/dt><dd>'+p[k]+'<\/dd>'}).join('')+'<\/dl>'},\n'/contact':function(){var k=[['Telepon / WhatsApp','082114399395'],['Email','fitry7191@gmail.com']];return '<h3>Kontak<\/h3><ul>'+k.map(function(x){return '<li><span class=\"m\">'+x[0]+':<\/span> '+x[1]+'<\/li>'}).join('')+'<\/ul>'},\n'/produk':function(){return '<h3>Daftar Produk<\/h3><p class=\"m\">Belum ada produk. Tambahkan lewat <code>php artisan tinker<\/code>.<\/p>'}\n};\nfunction go(p){p=(p||'').trim()||'/';if(p[0]!=='/')p='/'+p;u.value=p;var m=p.match(/^\\/hello\\/([^\\/]+)$/),h;\n if(R[p])h=R[p]();else if(m){var n=decodeURIComponent(m[1]);h='<h3>Halo, '+esc(n.charAt(0).toUpperCase()+n.slice(1))+'!<\/h3><p class=\"m\">Nama ini diambil dari bagian URL.<\/p>'}\n else h='<div class=\"e404\"><b>404<\/b> | NOT FOUND<\/div>';\n pg.innerHTML=nav+h}\n['/','/about','/contact','/hello/budi','/produk','/tidak-ada'].forEach(function(p){var b=document.createElement('button');b.textContent=p;b.onclick=function(){go(p)};q.appendChild(b)});\ndocument.getElementById('go').onclick=function(){go(u.value)};\nu.onkeydown=function(e){if(e.key==='Enter')go(u.value)};\ngo('/');\n"}</script>
<script>
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var V=document.getElementById('view'),T=document.getElementById('tabs');
var KEY='tr-'+D.id,st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
var tab='ringkasan',cur=D.files[0].path,TABS=[['ringkasan','Ringkasan'],['kode','Kode proyek'],['readme','README'],['demo','Demo']];
function copy(text,btn){var done=function(){var o=btn.textContent;btn.textContent='Tersalin';setTimeout(function(){btn.textContent=o},1400)};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fb)}else fb();
 function fb(){var a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()}}
function tabs(){T.innerHTML='';TABS.forEach(function(t){var b=document.createElement('button');b.textContent=t[1];b.setAttribute('role','tab');b.setAttribute('aria-selected',t[0]===tab);b.onclick=function(){tab=t[0];draw()};T.appendChild(b)})}
function ringkasan(){
 V.innerHTML='<p class="lead">'+esc(D.lead)+'</p><h2>Pemetaan requirement</h2><ul class="req">'+D.reqs.map(function(r){return '<li><div class="rq"><span><b>'+esc(r.t)+'</b><small>'+r.f.map(function(f){return '<button class="lnk" data-f="'+esc(f)+'">'+esc(f)+'</button>'}).join('')+'</small></span></div></li>'}).join('')+'</ul>'+
 '<h2>Bonus</h2><ul class="bul">'+D.bonus.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
 V.querySelectorAll('.lnk').forEach(function(b){b.onclick=function(e){e.preventDefault();e.stopPropagation();cur=b.dataset.f;tab='kode';draw()}})}
function kode(){
 var f=D.files.filter(function(x){return x.path===cur})[0]||D.files[0];
 V.innerHTML='<div class="code-wrap"><div class="files" role="list"></div><div class="cbox"><div class="cbar"><span></span><button>Salin file</button></div><pre class="code"></pre></div></div>';
 var L=V.querySelector('.files');
 D.files.forEach(function(x){var b=document.createElement('button');b.textContent=x.path;b.setAttribute('aria-current',x.path===f.path);b.onclick=function(){cur=x.path;kode()};L.appendChild(b)});
 V.querySelector('.cbar span').textContent=f.path;V.querySelector('pre').textContent=f.code;
 V.querySelector('.cbar button').onclick=function(){copy(f.code,this)}}
function readme(){V.innerHTML='<div class="cbox"><div class="cbar"><span>README.md</span><button>Salin README</button></div><pre class="code" style="white-space:pre-wrap"></pre></div>';
 V.querySelector('pre').textContent=D.readme;V.querySelector('.cbar button').onclick=function(){copy(D.readme,this)}}
function demo(){V.innerHTML=D.demoHtml;try{new Function(D.demoJs)()}catch(e){V.insertAdjacentHTML('beforeend','<p class="note">Demo gagal dimuat: '+esc(e.message)+'</p>')}}
function draw(){tabs();({ringkasan:ringkasan,kode:kode,readme:readme,demo:demo})[tab]()}
draw();
})();
</script>
